services:
  postgres:
    image: postgres:18
    container_name: giacobello-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: giacobello
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - giacobello-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d giacobello"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: giacobello-app
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/giacobello
      DATABASE_URL: jdbc:postgresql://postgres:5432/giacobello
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  giacobello-pgdata: